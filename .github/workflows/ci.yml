# Build, lint and test lumap.
# The Linux test job installs Mesa's lavapipe so the wgpu renderer is compared against the
# software oracle headlessly; the Windows jobs prove the app and the Spout feature build there.
name: Build lumap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumap-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo run -p xtask -- file-lengths
      - run: cargo run -p xtask -- check-platforms
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the site and its checker
        run: |
          python3 scripts/check_site.py
          python3 -m unittest discover -s tests/site -p "test_*.py"
      - name: Test the page script (100% lines, branches, functions)
        run: node --test --experimental-test-coverage --test-coverage-include='site/**' --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 tests/site/app.test.mjs

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: ffmpeg for the video tests (macOS)
        if: runner.os == 'macOS'
        # Metal is available on GitHub's Mac runners; the golden tests then prove it against the
        # oracle. Nothing is required yet: a runner without a usable adapter must not fail the
        # matrix until a Mac build ships.
        run: |
          brew install ffmpeg
          echo "LUMAP_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - name: Install a software Vulkan driver (lavapipe) and require the GPU path
        if: runner.os == 'Linux'
        # Linux must prove the GPU path. Windows runners have no GPU driver, so there the GPU
        # tests skip themselves (wgpu may still find a DX12 WARP adapter, in which case they run).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1 libasound2-dev ffmpeg
          echo "LUMAP_REQUIRE_GPU=1" >> "$GITHUB_ENV"
          echo "LUMAP_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
      - name: Unit, integration and golden tests
        run: cargo nextest run --workspace --all-features --no-fail-fast
      - name: Doc tests
        run: cargo test --workspace --all-features --doc
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            tests/golden/*.actual.png
            tests/golden/*.diff.png

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1 libasound2-dev ffmpeg
      - name: Measure
        run: cargo llvm-cov nextest --workspace --all-features --json --summary-only --output-path coverage.json
        env:
          LUMAP_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
      - name: Enforce 100% per file (lines, regions, branches; window shell excluded)
        shell: bash
        run: |
          set -o pipefail
          cargo run -q -p xtask -- check-coverage coverage.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo check --workspace --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Read the version from the workspace manifest
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Install silently, run the installed app, uninstall
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Installer (Get-Item dist/lumap-Setup-*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: lumap-windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
      - name: Summary
        shell: bash
        run: |
          {
            echo "### lumap build ${{ github.run_id }}"
            echo
            echo "The **lumap-windows-x64** artifact holds the installer and the portable zip, each with its SHA-256."
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: macOS build (universal, macOS 12 floor)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lumap-app --target aarch64-apple-darwin --locked
      - run: cargo build --release -p lumap-app --target x86_64-apple-darwin --locked
      - name: Universal binary, ad-hoc signed
        run: |
          mkdir -p dist
          lipo -create -output dist/lumap target/aarch64-apple-darwin/release/lumap target/x86_64-apple-darwin/release/lumap
          codesign --sign - --force dist/lumap
          lipo -info dist/lumap
          dist/lumap --version
          dist/lumap validate examples/two-projector-demo.lumap.toml
      - uses: actions/upload-artifact@v4
        with:
          name: lumap-macos-universal
          if-no-files-found: error
          path: dist/lumap

  publish:
    name: Publish a new version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, deny, test, coverage, msrv, site, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumap-windows-x64
          path: dist
      - name: Publish when the version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag is already released; bump the version in Cargo.toml to publish again."
            exit 0
          fi
          cd dist
          sha256sum --check "lumap-Setup-$version.exe.sha256"
          sha256sum --check "lumap-$version-windows-x64.zip.sha256"
          # The same installer under a name that never changes, so .../releases/latest/download/lumap-Setup.exe
          # (the website's download button and the in-app updater's fallback) is always the newest.
          cp "lumap-Setup-$version.exe" lumap-Setup.exe
          gh release create "$tag" lumap-Setup-*.exe lumap-Setup-*.exe.sha256 lumap-Setup.exe lumap-*-windows-x64.zip lumap-*-windows-x64.zip.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "lumap $version"             --generate-notes             --latest
          echo "### Published lumap $version" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
