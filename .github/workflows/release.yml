# Publishes lumap for Windows as a GitHub Release: a per-user installer with ffmpeg inside, the
# same installer under the fixed name lumap-Setup.exe (what the website's download button and
# releases/latest/download point at), a portable zip, and a SHA-256 file beside each.
#   push a v* tag       -> release with that exact version
#   workflow_dispatch   -> build-<run number> pre-release from any branch
name: Release lumap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumap-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, install, publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; name="${tag#v}"; prerelease=false
          else
            crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            name="${crate}-build.${GITHUB_RUN_NUMBER}"; tag="build-${GITHUB_RUN_NUMBER}"; prerelease=true
          fi
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $name, tag $tag, prerelease=$prerelease"

      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ steps.version.outputs.name }}"

      - name: Install silently, run the installed app, uninstall
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Installer (Get-Item dist/lumap-Setup-*.exe).FullName

      - name: Fixed-name copy of the installer
        run: cp "dist/lumap-Setup-${{ steps.version.outputs.name }}.exe" dist/lumap-Setup.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: lumap ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/lumap-Setup-*.exe
            dist/lumap-Setup-*.exe.sha256
            dist/lumap-Setup.exe
            dist/lumap-*-windows-x64.zip
            dist/lumap-*-windows-x64.zip.sha256
          fail_on_unmatched_files: true

      - name: Summary
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Published lumap $NAME"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "The website's button points at the fixed name: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lumap-Setup.exe"
          } >> "$GITHUB_STEP_SUMMARY"
