# Publishes lumap for Windows as a GitHub Release.
#   push a v* tag       -> release with that exact version
#   workflow_dispatch   -> build-<run number> pre-release from any branch
name: Release lumap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumap-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_SLUG: "lumap"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish Windows binary
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; name="${tag#v}"; prerelease=false
          else
            crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            name="${crate}-build.${GITHUB_RUN_NUMBER}-${GITHUB_REF_NAME//\//-}"; tag="build-${GITHUB_RUN_NUMBER}"; prerelease=true
          fi
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $name, tag $tag, prerelease=$prerelease"

      - name: Build
        run: cargo build --release -p lumap-app --features spout --locked

      - name: Package
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist/stage
          cp target/release/lumap.exe dist/stage/
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/stage/
          cp -r examples dist/stage/examples
          (cd dist/stage && 7z a -tzip "../${PROJECT_SLUG}-${NAME}-windows-x64.zip" ./* > /dev/null)
          rm -rf dist/stage
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: lumap ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Published lumap $NAME"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
