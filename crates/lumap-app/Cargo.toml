[package]
name = "lumap-app"
description = "lumap: projection mapping editor, show player and headless CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lumap"
path = "src/main.rs"

[features]
default = []
# Spout receiver (Windows). Forwarded to lumap-sources.
spout = ["lumap-sources/spout"]

[dependencies]
lumap-core.workspace = true
lumap-render.workspace = true
lumap-sources.workspace = true
lumap-control.workspace = true
wgpu.workspace = true
winit.workspace = true
eframe.workspace = true
egui.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
rfd.workspace = true
dirs.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
egui_kittest.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
