[package]
name = "lumap-vision"
description = "Computer vision for the lumap projection mapper: structured-light scans, surface finding, tracking and room effects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# The synthetic camera used by tests here and by the app's UI tests.
studio = []
# The MediaPipe hand tracker (`hands`), run with tract; the models ship beside lumap.
hands = ["dep:tract-onnx", "dep:tract-linalg"]

[dependencies]
lumap-core.workspace = true
tract-onnx = { workspace = true, optional = true }
# Only for its thread pool (`multithread-mm`), which tract leaves off by default.
tract-linalg = { workspace = true, optional = true, features = ["multithread-mm"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
